[project]
name = "docx-normalizer"
version = "0.1.0"
description = "Normalize messy (PDF-converted, hand-edited) Word documents: real headings, real TOC, page breaks before sections and tables."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5",
]

[project.scripts]
docx-normalize = "docx_normalizer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_normalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
